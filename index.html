<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B2A4A" />
<title>辐照度会商助手</title>
<style>
  :root{
    --bg:#F4F5F7;
    --card:#FFFFFF;
    --ink:#111827;
    --sub:#4B5563;
    --faint:#9CA3AF;
    --line:#E5E7EB;
    --line2:#D1D5DB;
    --accent:#2563EB;
    --accent-d:#1D4ED8;
    --ok:#15803D;
    --warn:#B45309;
    --err:#DC2626;
    --dark:#0B2A4A;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink,#111827);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .app{max-width:520px;margin:0 auto;padding:20px 16px 90px;}

  /* ===== Header ===== */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:6px 2px 16px;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2563EB,#1E40AF);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;flex:none;}
  .brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.01em;}
  .brand p{margin:1px 0 0;font-size:11.5px;color:var(--faint);}
  .date-wrap{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);}
  .date-wrap input[type=date]{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink);outline:none;}

  /* —— 通用卡片 —— */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .card-head .step{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .card-head .t{font-size:14px;font-weight:700;}
  .card-head .spacer{flex:1;}
  .card-head .hint{font-size:11px;color:var(--faint);font-weight:400;}

  /* —— 粘贴 —— */
  textarea{
    width:100%;min-height:88px;font-size:14px;line-height:1.65;color:var(--ink);
    border:1px solid var(--line2);border-radius:10px;padding:10px 12px;resize:vertical;
    background:#FCFCFD;outline:none;transition:border-color .15s;font-family:var(--sans);
  }
  textarea:focus{border-color:var(--accent);}
  .paste-bar{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;padding:8px 16px;transition:opacity .15s,background .15s;-webkit-user-select:none;user-select:none;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{opacity:.9;}
  .btn-ghost{background:transparent;color:var(--sub);border:1px solid var(--line2);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .status{font-size:12px;color:var(--faint);line-height:1.5;}
  .status.ok{color:var(--ok,#15803D);}
  .status.err{color:var(--err);}

  /* —— 数据表单 —— */
  .subsection{margin:4px 0 10px;}
  .sub-title{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px;}
  .sub-title .d{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:500;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .cell label{display:block;font-size:11.5px;color:var(--faint);margin-bottom:3px;font-weight:500;}
  .cell input{
    width:100%;font-size:16px;font-family:var(--mono);font-weight:600;color:var(--ink);
    border:1px solid var(--line2);border-radius:9px;padding:8px 10px;outline:none;background:#fff;
    transition:border-color .15s;
  }
  .cell input:focus{border-color:var(--accent);}
  .cell input::placeholder{color:#C6CBD4;font-weight:400;font-size:13px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

  /* —— 报告 —— */
  .report{
    background:#EFF6FF;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;
    padding:12px 14px;font-size:14px;line-height:1.75;color:#1E3A5F;
    white-space:pre-wrap;word-break:break-word;min-height:56px;
  }
  .report .miss{color:#94A3B8;}
  .report .low{color:var(--accent-d);font-weight:600;}
  .report .high{color:var(--err);font-weight:600;}
  .report .same{color:var(--ok,#15803d);font-weight:600;}

  /* —— 综合计算器 —— */
  .calc{background:linear-gradient(160deg,#0B2A4A,#123B66);border-color:#123B66;color:#EAF2FB;}
  .calc .card-head .t{color:#fff;}
  .calc .card-head .hint{color:#9DB8D9;}
  .tabs{display:flex;gap:6px;margin-bottom:10px;}
  .tab{flex:1;text-align:center;font-size:13px;font-weight:600;color:#9DB8D9;padding:7px 0;border-radius:9px;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid transparent;transition:all .15s;}
  .tab.active{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.25);}
  .calc .grid{margin-bottom:10px;}
  .calc .cell label{color:#9DB8D9;}
  .calc .cell input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;}
  .calc .cell input:focus{border-color:#93C5FD;}
  .calc .cell input::placeholder{color:#7E9CC0;}
  .calc-out{
    border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.7;
    background:rgba(0,0,0,.28);min-height:50px;
  }
  .calc-out .num{font-size:26px;font-weight:800;color:#7DD3FC;display:block;margin:2px 0;}
  .calc-out .formula{font-size:11.5px;color:#9DB8D9;}
  .calc-bar{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}

  /* —— 脚注与toast —— */
  .foot{margin-top:22px;font-size:11px;color:var(--faint);line-height:1.7;text-align:center;}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translateX(-50%) translateY(16px);background:#111827;color:#FAFAF7;font-size:13px;font-weight:500;padding:10px 20px;border-radius:999px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="logo">☀</div>
      <div>
        <h1>辐照度会商助手</h1>
        <p>预测 · 复盘 · 综合 · 一键出文</p>
      </div>
    </div>
    <div class="date-wrap">
      <span>目标日</span>
      <input type="date" id="targetDate" aria-label="目标日" />
    </div>
  </header>

  <!-- 1 粘贴 -->
  <section class="card">
    <div class="card-head">
      <span class="step">1</span>
      <span class="t">粘贴会商消息</span>
      <span class="spacer"></span>
      <span class="hint">微信文字直接粘</span>
    </div>
    <textarea id="pasteInput" rows="3" placeholder="粘贴消息文字，例如：&#10;9月10日 日内订正 服务中心_600-650_ 金风_665_；日前 服务中心_600_ 金风_548_；真值：632&#10;或官方日报全文……"></textarea>
    <div class="paste-bar">
      <button class="btn btn-primary" id="pasteBtn">自动解析</button>
      <span class="status" id="pasteHint">支持：真值 / 日前 / 日内 / 服务中心 / 金风 / 区间 / 偏大偏小</span>
    </div>
  </section>

  <!-- 2 数据 -->
  <section class="card">
    <div class="card-head">
      <span class="step">2</span>
      <span class="t">预测数据</span>
      <span class="spacer"></span>
      <span class="hint">可直接手改</span>
    </div>

    <div class="subsection">
      <div class="sub-title">
        <span>日前预测</span>
        <span id="prevDate">—</span>
      </div>
      <div class="grid">
        <div class="cell">
          <label for="prev-center">服务中心</label>
          <input id="prev-center" inputmode="decimal" placeholder="600 或 550-600" autocomplete="off" />
        </div>
        <div class="cell">
          <label for="prev-jinfeng">金风</label>
          <input id="prev-jinfeng" inputmode="decimal" placeholder="548" autocomplete="off" />
        </div>
      </div>
    </div>

    <div class="subsection">
      <div class="sub-title">
        <span>日内订正</span>
        <span id="intraDate">—</span>
      </div>
      <div class="grid">
        <div class="cell">
          <label for="intra-center">服务中心</label>
          <input id="intra-center" inputmode="decimal" placeholder="600-650" autocomplete="off" />
        </div>
        <div class="cell">
          <label for="intra-jinfeng">金风</label>
          <input id="intra-jinfeng" inputmode="decimal" placeholder="665" autocomplete="off" />
        </div>
      </div>
    </div>

    <div class="subsection">
      <div class="sub-title">
        <span>会商与真值</span>
        <span id="truthDate">—</span>
      </div>
      <div class="grid3">
        <div class="cell">
          <label for="consult-da">日前出口</label>
          <input id="consult-da" inputmode="decimal" placeholder="600" autocomplete="off" />
        </div>
        <div class="cell">
          <label for="consult">日内会商</label>
          <input id="consult" inputmode="decimal" placeholder="640" autocomplete="off" />
        </div>
        <div class="cell">
          <label for="truth">真值</label>
          <input id="truth" inputmode="decimal" placeholder="632" autocomplete="off" />
        </div>
      </div>
    </div>
  </section>

  <!-- 3 报告 -->
  <section class="card">
    <div class="card-head">
      <span class="step">3</span>
      <span class="t">会商报告</span>
      <span class="spacer"></span>
      <button class="btn btn-ghost" id="copyBtn" disabled>复制报告</button>
    </div>
    <div class="report" id="outBox">填写或粘贴数据后自动生成。</div>
  </section>

  <!-- 综合计算器 -->
  <section class="card calc">
    <div class="card-head">
      <span class="t">综合计算器</span>
      <span class="spacer"></span>
      <span class="hint">权重：w=0.85 / 0.75</span>
    </div>
    <div class="tabs">
      <div class="tab active" data-epoch="intra">日内（w=0.75）</div>
      <div class="tab" data-epoch="prev">日前（w=0.85）</div>
    </div>
    <div class="grid">
      <div class="cell">
        <label for="clc-c">服务中心</label>
        <input id="clc-c" inputmode="decimal" placeholder="625 或 600-650" autocomplete="off" />
      </div>
      <div class="cell">
        <label for="clc-j">金风</label>
        <input id="clc-j" inputmode="decimal" placeholder="665" autocomplete="off" />
      </div>
    </div>
    <div class="calc-out" id="clcOut">
      <span class="num">—</span>
      <span class="formula" id="clcFormula">输入值后自动综合（10 取整）</span>
    </div>
    <div class="calc-bar">
      <button class="btn btn-ghost" id="clcCopy" style="border-color:rgba(255,255,255,.25);color:#EAF2FB;">复制结论</button>
      <span class="status" style="color:#9DB8D9;">区间取中值 · 结果仅前端计算</span>
    </div>
  </section>

  <div class="foot">真值落在预测区间内记「区间内」；预测小于真值记「偏小」，大于记「偏大」。权重由历史样本回测，随样本更新。</div>
</div>

<div class="toast" id="toast">已复制</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };

  /* ================= 工具 ================= */
  var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
  function shanghaiNow() {
    var f = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit" });
    var p = f.formatToParts(new Date()), y, m, d;
    p.forEach(function (x) { if (x.type === "year") y = x.value; if (x.type === "month") m = x.value; if (x.type === "day") d = x.value; });
    return new Date(+y, +m - 1, +d);
  }
  var iso = function (dt) { return dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate()); };
  var cn = function (dt) { return (dt.getMonth() + 1) + "月" + dt.getDate() + "日"; };
  var toDate = function (s) { if (!s) return null; var p = s.split("-"); if (p.length !== 3) return null; return new Date(+p[0], +p[1] - 1, +p[2]); };
  var prevDay = function (dt) { return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - 1); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  /* 数值解析：单值 / 区间 */
  function parseVal(raw) {
    if (raw == null) return null;
    var s = String(raw).trim();
    if (!s) return null;
    s = s.replace(/\s+/g, "").replace(/[～~—–]/g, "-");
    var r = s.match(/^(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)$/);
    if (r) { var lo = +r[1], hi = +r[2]; if (lo > hi) { var t = lo; lo = hi; hi = t; } return { type: "range", lo: lo, hi: hi }; }
    var s2 = s.match(/^(\d+(?:\.\d+)?)$/);
    if (s2) return { type: "single", val: +s2[1] };
    return null;
  }
  var mid = function (v) { return v ? (v.type === "range" ? (v.lo + v.hi) / 2 : v.val) : null; };
  var fmt = function (v) {
    if (!v) return null;
    var r = v.type === "range" ? Math.round(v.lo) + "～" + Math.round(v.hi) : String(Math.round(v.val));
    return r + " W/m²";
  };

  /* 偏差判断 */
  function calcDev(p, truth) {
    if (!p || !truth || truth.type !== "single") return null;
    var T = truth.val;
    if (p.type === "single") {
      var P = p.val;
      if (P === T) return { t: "与实际一致", c: "same" };
      return P < T ? { t: "偏小" + Math.round(T - P) + " W/m²", c: "low" } : { t: "偏大" + Math.round(P - T) + " W/m²", c: "high" };
    }
    if (T >= p.lo && T <= p.hi) return { t: "区间内", c: "same" };
    if (T > p.hi) return { t: "偏小" + Math.round(T - p.hi) + "～" + Math.round(T - p.lo) + " W/m²", c: "low" };
    return { t: "偏大" + Math.round(p.lo - T) + "～" + Math.round(p.hi - T) + " W/m²", c: "high" };
  }
  function devTag(v, truth) {
    if (!v) return { txt: "___", html: '<span class="miss">___</span>' };
    var valTxt = fmt(v);
    var d = calcDev(v, truth);
    if (!d) return { txt: valTxt, html: esc(valTxt) };
    return { txt: valTxt + "（" + d.t + "）", html: esc(valTxt) + "（<span class=\"" + d.c + "\">" + esc(d.t) + "</span>）" };
  }

  /* ================= 粘贴解析 ================= */
  function parseMsg(txt) {
    var t = String(txt || "").replace(/[_＿\u3000]/g, "").replace(/[～~]/g, "-").replace(/[\s，,；;]+/g, " ");
    var res = {};
    var isFormal = /预测为|订正为|调整为/.test(t);
    var m = t.match(/(?:真值|实际辐照度峰值|辐照度峰值为|真值为)[^0-9]{0,6}?(\d{2,4}(?:-\d{2,4})?)/);
    if (m) res.truth = m[1];
    [{ k: "日前", pf: "prev" }, { k: "日内", pf: "intra" }].forEach(function (o) {
      var ki = t.indexOf(o.k);
      if (ki < 0) return;
      var seg = t.slice(ki + o.k.length, ki + o.k.length + 86);
      var ci = seg.indexOf("服务中心"), ji = seg.indexOf("金风");
      function numAfter(pos) { var s = seg.slice(pos); var mm = s.match(/^[^0-9]{0,8}?(\d{2,4}(?:-\d{2,4})?)/); return mm ? mm[1] : null; }
      if (ci >= 0 && ji >= 0) {
        var a = ci < ji ? [numAfter(ci), "Center"] : [numAfter(ji), "Jinfeng"];
        var b = ci < ji ? [numAfter(ji), "Jinfeng"] : [numAfter(ci), "Center"];
        if (a[0] != null) res[o.pf + a[1]] = a[0];
        if (b[0] != null) res[o.pf + b[1]] = b[0];
      } else if (ci >= 0) {
        var v1 = numAfter(ci); if (v1 != null) res[o.pf + "Center"] = v1;
      } else if (ji >= 0) {
        var v2 = numAfter(ji); if (v2 != null) res[o.pf + "Jinfeng"] = v2;
      }
    });
    function srcGrab(label, slot) {
      var ix = t.indexOf(label);
      if (ix < 0) return;
      var win = t.slice(ix, ix + 96);
      var oi = win.indexOf(label === "服务中心" ? "金风" : "服务中心");
      if (oi > -1) win = win.slice(0, oi);
      var re2 = new RegExp("(日前|日内)[^0-9]{0,8}?(\\d{2,4}(?:-\\d{2,4})?)", "g");
      var mm;
      while ((mm = re2.exec(win))) {
        var kk = mm[1] === "日前" ? "prev" : "intra";
        if (isFormal || !res[kk + slot]) res[kk + slot] = mm[2];
      }
    }
    srcGrab("服务中心", "Center");
    srcGrab("金风", "Jinfeng");
    return res;
  }

  /* ================= 全流程 ================= */
  var els = {
    targetDate: $("targetDate"), prevDate: $("prevDate"), intraDate: $("intraDate"), truthDate: $("truthDate"),
    pasteInput: $("pasteInput"), pasteBtn: $("pasteBtn"), pasteStatus: $("pasteHint"),
    prevCenter: $("prev-center"), prevJinfeng: $("prev-jinfeng"),
    intraCenter: $("intra-center"), intraJinfeng: $("intra-jinfeng"),
    consultDa: $("consult-da"), consult: $("consult"), truth: $("truth"),
    outBox: $("outBox"), copyBtn: $("copyBtn"),
    clcC: $("clc-c"), clcJ: $("clc-j"), clcOut: $("clcOut"), clcFormula: $("clcFormula"), clcCopy: $("clcCopy"),
    toast: $("toast")
  };

  var lastText = "";
  var showToast = function (m) {
    els.toast.textContent = m;
    els.toast.classList.add("show");
    setTimeout(function () { els.toast.classList.remove("show"); }, 1500);
  };
  function fallbackCopy(t) {
    var ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); showToast("已复制"); } catch (e) { showToast("复制失败"); }
    document.body.removeChild(ta);
  }
  function copyText(t, okMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { showToast(okMsg || "已复制"); }, function () { fallbackCopy(t); });
    } else fallbackCopy(t);
  }

  function readForm() {
    return {
      prevCenter: parseVal(els.prevCenter.value), prevJinfeng: parseVal(els.prevJinfeng.value),
      intraCenter: parseVal(els.intraCenter.value), intraJinfeng: parseVal(els.intraJinfeng.value),
      consultDa: parseVal(els.consultDa.value), consult: parseVal(els.consult.value), truth: parseVal(els.truth.value)
    };
  }
  function badInputs() {
    var list = [
      ["日前服务中心", els.prevCenter], ["日前金风", els.prevJinfeng],
      ["日内服务中心", els.intraCenter], ["日内金风", els.intraJinfeng],
      ["会商日前出口", els.consultDa], ["会商日内", els.consult], ["真值", els.truth]
    ];
    return list.filter(function (c) { return c[1].value.trim() && !parseVal(c[1].value); }).map(function (c) { return c[0]; });
  }

  /* 生成报告 */
  function build() {
    var bad = badInputs();
    var dt = toDate(els.targetDate.value) || shanghaiNow();
    var dateCN = cn(dt);
    var v = readForm();

    if (bad.length) {
      els.outBox.innerHTML = '<span class="miss">无法解析：' + esc(bad.join("、")) + '。请填写数值或区间。</span>';
      lastText = ""; els.copyBtn.disabled = true; return;
    }
    if (!v.truth || v.truth.type !== "single") {
      els.outBox.innerHTML = '<span class="miss">填写目标日真值后自动生成报告。</span>';
      lastText = ""; els.copyBtn.disabled = true; return;
    }

    var T = v.truth.val;
    var truthStr = Math.round(T) + " W/m²";
    function segTag(f) { return devTag(f, v.truth); }
    var sDa = devTag(v.consultDa, v.truth), sC = devTag(v.consult, v.truth),
        sPC = devTag(v.prevCenter, v.truth), sPJ = devTag(v.prevJinfeng, v.truth),
        sIC = devTag(v.intraCenter, v.truth), sIJ = devTag(v.intraJinfeng, v.truth);

    var p1 = dateCN + "辐照度预测情况：" + dateCN + "实际辐照度峰值为" + truthStr + "。经会商，日前出口为" + sDa.txt + "，日内会商辐照度峰值调整为" + sC.txt + "。";
    var p2 = "服务中心日前预测为" + sPC.txt + "，日内预测为" + sIC.txt + "；金风日前预测为" + sPJ.txt + "，日内预测为" + sIJ.txt + "。";
    var p2h = "服务中心日前预测为" + sPC.html + "，日内预测为" + sIC.html + "；" + "金风日前预测为" + sPJ.html + "，日内预测为" + sIJ.html + "。";
    lastText = p1 + p2;
    els.outBox.innerHTML = esc(p1) + p2h;
    els.copyBtn.disabled = false;
  }

  /* ================= 综合计算器 ================= */
  var CALC_W = { intra: 0.75, prev: 0.85 };
  var curEpoch = "intra";
  function bindTabs() {
    var tabs = document.querySelectorAll(".tab");
    tabs.forEach(function (tb) {
      tb.addEventListener("click", function () {
        tabs.forEach(function (x) { x.classList.remove("active"); });
        tb.classList.add("active");
        curEpoch = tb.getAttribute("data-epoch");
        renderCalc();
      });
    });
  }
  function renderCalc() {
    var c = parseVal(els.clcC.value), j = parseVal(els.clcJ.value);
    if (!c && !j) { els.clcOut.innerHTML = '<span class="num">—</span><span class="formula">输入服务中心和/或金风值</span>'; return; }
    var w = CALC_W[curEpoch];
    var mc = mid(c) || 0, mj = mid(j) || 0;
    var e = w * mc + (1 - w) * mj;
    var out = Math.round(e / 10) * 10;
    var tag = curEpoch === "intra" ? "日内" : "日前";
    els.clcOut.innerHTML = '<span class="num">' + out + ' W/m²</span>' +
      '<span class="formula">' + tag + "：" + (c ? fmtValN(mc) : "—") + " ×" + w.toFixed(2) + " + " + (j ? fmtValN(mj) : "—") + " ×" + (1 - w).toFixed(2) + " = " + e.toFixed(1) + " → 取整10</span>";
  }
  var fmtValN = function (n) { return Math.round(n); };

  /* 复制结论 */
  function clcCopyText() {
    var c = parseVal($("clc-c").value), j = parseVal($("clc-j").value);
    var w = CALC_W[curEpoch];
    var mc = mid(c) || 0, mj = mid(j) || 0;
    var e = w * mc + (1 - w) * mj;
    var out = Math.round(e / 10) * 10;
    copyText("综合结论（" + (curEpoch === "intra" ? "日内" : "日前") + "）：" + out + " W/m²", "已复制结论");
  }

  /* ================= 绑定 ================= */
  function applyParsed(res) {
    var map = { prevCenter: "prev-center", prevJinfeng: "prev-jinfeng", intraCenter: "intra-center", intraJinfeng: "intra-jinfeng", truth: "truth" };
    var filled = [];
    Object.keys(map).forEach(function (k) { if (res[k]) { $(map[k]).value = res[k]; filled.push(k); } });
    return filled;
  }
  function doParse() {
    var txt = els.pasteInput.value;
    if (!txt.trim()) { els.pasteStatus.innerHTML = '<span class="err">请先粘贴消息文字</span>'; return; }
    var res = parseMsg(txt);
    var filled = applyParsed(res);
    var parts = [];
    if (res.truth) parts.push("真值" + res.truth);
    if (res.prevCenter) parts.push("日前服" + res.prevCenter);
    if (res.prevJinfeng) parts.push("日前金" + res.prevJinfeng);
    if (res.intraCenter) parts.push("日内服" + res.intraCenter);
    if (res.intraJinfeng) parts.push("日内金" + res.intraJinfeng);
    if (parts.length) {
      els.pasteStatus.innerHTML = '<span class="ok">✓ 已识别 ' + parts.length + ' 项 → ' + parts.join("｜") + '</span>';
      build();
    } else {
      els.pasteStatus.innerHTML = '<span class="err">未识别到数值。参考：「日前：服务中心 600 金风 548」或「真值：632」</span>';
    }
  }

  var composing = false, raf = null;
  function schedule() { if (raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(function () { raf = null; build(); }); }
  ["prev-center", "prev-jinfeng", "intra-center", "intra-jinfeng", "consult-da", "consult", "truth"].forEach(function (id) {
    var el = $(id);
    el.addEventListener("compositionstart", function () { composing = true; });
    el.addEventListener("compositionend", function () { composing = false; schedule(); });
    el.addEventListener("input", function () { if (!composing) schedule(); });
  });
  ["clc-c", "clc-j"].forEach(function (id) { $(id).addEventListener("input", renderCalc); });
  els.targetDate.addEventListener("change", schedule);
  els.targetDate.addEventListener("input", function () { if (!composing) schedule(); });
  els.copyBtn.addEventListener("click", function () { if (lastText) copyText(lastText); });
  els.pasteBtn.addEventListener("click", doParse);
  els.clcCopy.addEventListener("click", clcCopyText);

  /* 日期标签 */
  function updateDateLabels() {
    var d = toDate(els.targetDate.value) || shanghaiNow();
    var p = prevDay(d);
    els.prevDate.textContent = cn(p);
    els.intraDate.textContent = cn(d);
    els.truthDate.textContent = cn(d);
  }

  /* 初始化 */
  (function init() {
    els.targetDate.value = iso(shanghaiNow());
    updateDateLabels();
    bindTabs();
    renderCalc();
  })();
})();
</script>
</body>
